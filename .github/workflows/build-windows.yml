name: Build Windows exe

# Every build gets a version number (1.0.<run number>). Pushes to the default
# branch also publish it as a GitHub release, which installed copies of the app
# find and update themselves to.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Set the version
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Set-Content gifmaker\version.py "__version__ = `"$v`""
          Get-Content gifmaker\version.py

      - name: Smoke test GIF conversion
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          import os, subprocess, tempfile
          from gifmaker import ffmpeg_tools as ff
          exe = ff.find_ffmpeg()
          d = tempfile.mkdtemp()
          src, dst = os.path.join(d, "in.mp4"), os.path.join(d, "out.gif")
          subprocess.run([exe, "-y", "-loglevel", "error", "-f", "lavfi",
                          "-i", "testsrc2=size=640x360:rate=30", "-t", "5",
                          "-pix_fmt", "yuv420p", src], check=True)
          print(ff.probe(exe, src))
          assert ff.grab_frame(exe, src, 1.0, 320, 180)
          assert ff.grab_frame(exe, src, 1.0, 320, 180, fast=True)
          thumbs = list(ff.iter_keyframes(exe, src, 160, 90, 0.5, lambda: False))
          assert thumbs and all(len(b) == 160 * 90 * 3 for _, b in thumbs), len(thumbs)
          err = ff.run_with_progress(ff.build_animation_command(exe, src, dst, 1.0, 3.0, 10, 320), 2.0)
          assert err is None, err
          assert os.path.getsize(dst) > 1000
          print("ok", os.path.getsize(dst))

      - name: Check drag and drop support loads
        run: >
          python -c "from tkinterdnd2 import TkinterDnD, DND_FILES;
          r = TkinterDnD.Tk(); r.drop_target_register(DND_FILES);
          print('tkdnd', r.tk.call('package', 'require', 'tkdnd')); r.destroy()"

      - name: Build the app
        run: >
          python -m PyInstaller --noconfirm --onedir --windowed --name GifMaker
          --icon assets\gifmaker.ico --add-data "assets;assets"
          --collect-all imageio_ffmpeg --collect-all tkinterdnd2 run_gifmaker.py

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\GifMaker\GifMaker.exe -ArgumentList '--selftest', "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          exit $p.ExitCode

      - name: Stress test the Rename tool with 13,000 files
        shell: pwsh
        run: |
          # First the old way (a swatch picture per file), just to see if Windows copes;
          # then as GifMaker does it now, which must pass.
          $env:APPDATA = "$PWD\stress-old"; $env:LOCALAPPDATA = "$PWD\stress-old"
          $old = Start-Process python -ArgumentList 'tools\stress_rename.py', "$PWD\stress-files", '13000', '100000' -Wait -PassThru -NoNewWindow
          "Old way (unlimited swatches) exit code: $($old.ExitCode)"
          if (Test-Path stress-old\GifMaker\crash.log) { Get-Content stress-old\GifMaker\crash.log | Select-Object -First 15 }
          $env:APPDATA = "$PWD\stress-new"; $env:LOCALAPPDATA = "$PWD\stress-new"
          $out = python tools\stress_rename.py "$PWD\stress-files" 13000
          $out
          if (-not ($out -match 'passed')) {
            if (Test-Path stress-new\GifMaker\crash.log) { Get-Content stress-new\GifMaker\crash.log }
            throw "the Rename tool didn't survive 13,000 files"
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Q "/DAppVersion=$env:VERSION" installer\GifMaker.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\GifMaker -DestinationPath dist\GifMaker-portable.zip

      - name: Test the installer
        shell: pwsh
        run: |
          $p = Start-Process dist\GifMaker-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NOLAUNCH' -Wait -PassThru
          if ($p.ExitCode) { throw "installer failed: $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\GifMaker"
          Get-Content "$app\install.ini"
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\GifMaker.Video\shell\open\command').'(default)'
          "open command: $cmd"
          if ((Get-ItemProperty 'HKCU:\Software\RegisteredApplications').GifMaker -ne 'Software\GifMaker\Capabilities') { throw "not registered" }
          (Get-ItemProperty 'HKCU:\Software\GifMaker\Capabilities\FileAssociations').'.mp4'
          if ((Get-ItemProperty 'HKCU:\Software\GifMaker\Capabilities\FileAssociations').'.jpg' -ne 'GifMaker.Picture') { throw "pictures not registered" }
          $p = Start-Process -FilePath "$app\GifMaker.exe" -ArgumentList '--selftest', "$PWD\installed.txt" -Wait -PassThru
          Get-Content installed.txt
          if ($p.ExitCode) { exit $p.ExitCode }
          $p = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait -PassThru
          # The uninstaller hands over to a copy of itself, so wait for it to finish.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\GifMaker.exe"); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          if (Test-Path 'HKCU:\Software\Classes\GifMaker.Video') { throw "uninstall left the file type behind" }
          "uninstalled cleanly"

      - name: Test updating from inside the app
        shell: pwsh
        run: |
          # Install this version, start it, and have it update itself (exactly as the
          # Update button does, minus the download) to an installer marked as newer.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Q "/DAppVersion=$env:VERSION.1" "/FGifMaker-Setup-next" installer\GifMaker.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $p = Start-Process dist\GifMaker-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NOLAUNCH' -Wait -PassThru
          if ($p.ExitCode) { throw "install failed: $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\GifMaker"
          # Closing must end the process even while it's busy (playing, making
          # thumbnails): a leftover GifMaker.exe would block the update.
          New-Item -ItemType Directory -Force clips, "$env:APPDATA\GifMaker" | Out-Null
          python -c "import imageio_ffmpeg, subprocess; [subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), '-loglevel', 'error', '-y', '-f', 'lavfi', '-i', f'testsrc2=size=640x360:rate=25', '-f', 'lavfi', '-i', 'sine', '-t', '20', '-pix_fmt', 'yuv420p', f'clips/clip{i}.mp4'], check=True) for i in range(12)]"
          Set-Content "$env:APPDATA\GifMaker\settings.json" '{"files_shown": true, "autoplay": true}'
          $p = Start-Process "$app\GifMaker.exe" -ArgumentList "`"$PWD\clips\clip3.mp4`"" -PassThru
          Start-Sleep 8
          $null = $p.CloseMainWindow()
          if (-not $p.WaitForExit(10000)) {
            Get-Content "$env:LOCALAPPDATA\GifMaker\exit.log" -ErrorAction SilentlyContinue
            throw "GifMaker was still running 10 s after its window closed"
          }
          "closed cleanly (exit.log: $((Get-Item "$env:LOCALAPPDATA\GifMaker\exit.log" -ErrorAction SilentlyContinue).Length) bytes)"
          Remove-Item "$env:APPDATA\GifMaker\settings.json"

          $env:GIFMAKER_TEST_UPDATE = "$PWD\dist\GifMaker-Setup-next.exe"
          Start-Process "$app\GifMaker.exe"
          Remove-Item Env:GIFMAKER_TEST_UPDATE
          $want = "version=$env:VERSION.1"
          for ($i = 0; $i -lt 120; $i++) {
            Start-Sleep 1
            if ((Get-Content "$app\install.ini" -Raw) -match [regex]::Escape($want)) { break }
          }
          Get-Content "$app\install.ini"
          $log = "$env:LOCALAPPDATA\GifMaker\update.log"
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 25 }
          if (-not ((Get-Content "$app\install.ini" -Raw) -match [regex]::Escape($want))) { throw "the update didn't install" }
          for ($i = 0; $i -lt 20 -and -not (Get-Process GifMaker -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          if (-not (Get-Process GifMaker -ErrorAction SilentlyContinue)) { throw "GifMaker didn't start again after the update" }
          "updated and restarted"
          Get-Process GifMaker | Stop-Process -Force
          Start-Sleep 2
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait

      - name: Check Show in folder highlights the files
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          $folder = "$PWD\clips"
          $shell = New-Object -ComObject Shell.Application
          function Close-Folder { foreach ($w in @($shell.Windows())) { if ($w.Document -and $w.Document.Folder.Self.Path -eq $folder) { $w.Quit() } }; Start-Sleep 2 }
          function Selected {
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              $w = @($shell.Windows() | Where-Object { $_.Document -and $_.Document.Folder.Self.Path -eq $folder })
              if ($w.Count) { $s = @($w[0].Document.SelectedItems() | ForEach-Object { Split-Path $_.Path -Leaf }); if ($s.Count) { return ,$s } }
            }
            if ($w.Count) { return ,@() } else { return $null }
          }
          # Selected items are compared by file name (Explorer may hide extensions).
          # For comparison, the old way.
          Close-Folder
          Start-Process explorer "/select,`"$folder\clip1.mp4`""
          $old = Selected
          "explorer /select: $(if ($old -eq $null) { 'no window' } else { 'selected [' + ($old -join ', ') + ']' })"
          Close-Folder
          python -c "from gifmaker import files; print('SHOpenFolderAndSelectItems ->', files._select_in_explorer([r'$folder\clip1.mp4', r'$folder\clip2.mp4']))"
          $new = Selected
          "GifMaker's way: $(if ($new -eq $null) { 'no window' } else { 'selected [' + ($new -join ', ') + ']' })"
          Close-Folder
          if ($new -eq $null) { "No Explorer window to check on this machine (skipped)"; exit 0 }
          if (($new -notcontains 'clip1.mp4') -or ($new -notcontains 'clip2.mp4')) {
            if ($old -ne $null -and $old.Count -eq 0) { "Explorer selects nothing here even the old way: this machine can't show selections (skipped)"; exit 0 }
            throw "the files weren't highlighted"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: GifMaker-Setup
          path: dist/GifMaker-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: GifMaker-portable
          path: dist/GifMaker

      - name: Publish a release (default branch only)
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: GifMaker ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          body: |
            ${{ github.event.head_commit.message }}

            **GifMaker-Setup.exe** installs it (and updates an installed copy); **GifMaker-portable.zip** runs without installing.
          files: |
            dist/GifMaker-Setup.exe
            dist/GifMaker-portable.zip
